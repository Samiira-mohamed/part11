name: Periodic health check

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check (leave empty for the deployed app)'
        required: false
        default: 'https://part11-j2sj.onrender.com/health'
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: ${{ inputs.url || 'https://part11-j2sj.onrender.com/health' }}
          max-attempts: 3
          retry-delay: 30s
